<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="viewer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="viewer-beam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#00d8f0"/>
    </linearGradient>
  </defs>
  <!-- 0px Obsidian Outer Chassis -->
  <rect x="8" y="8" width="240" height="240" fill="url(#viewer-bg)" stroke="#2b2b2b" stroke-width="4"/>
  <!-- Top-Left Aero Specular Edge Catch (Parchment Gold) -->
  <path d="M 8 96 L 8 8 L 128 8" fill="none" stroke="#dcdcaa" stroke-width="6"/>

  <!-- Chamfered Read-Only Document Sheet -->
  <polygon points="44,38 144,38 178,72 178,214 44,214" fill="#161616" stroke="#3a3a3a" stroke-width="4"/>
  <!-- 45-Degree Folded Corner Triangle -->
  <polygon points="144,38 144,72 178,72" fill="#dcdcaa"/>

  <!-- Heading Bar & Refracted Cyan Hairline -->
  <rect x="64" y="64" width="60" height="10" fill="#ffffff"/>
  <rect x="64" y="84" width="94" height="5" fill="#00d8f0"/>

  <!-- Embedded Image / Vector Preview Frame -->
  <rect x="64" y="102" width="94" height="50" fill="#0e0e0e" stroke="#2b2b2b" stroke-width="2"/>
  <polygon points="66,150 96,118 124,150" fill="#0078d4"/>
  <polygon points="104,150 132,124 156,150" fill="#00d8f0" opacity="0.85"/>
  <rect x="136" y="110" width="10" height="10" fill="#dcdcaa"/>

  <!-- Body Copy Bars -->
  <rect x="64" y="166" width="60" height="6" fill="#666666"/>
  <rect x="64" y="182" width="44" height="6" fill="#4a4a4a"/>

  <!-- Foreground Chamfered Octagonal Optical Inspection Prism -->
  <polygon points="148,128 188,128 208,148 208,188 188,208 148,208 128,188 128,148" fill="#0e0e0e" stroke="url(#viewer-beam)" stroke-width="7"/>
  <!-- Diagonal Aero Glass Glint -->
  <polygon points="142,158 172,138 186,138 142,172" fill="#00d8f0" opacity="0.45"/>
  <!-- Precision Center Diamond Reticle -->
  <polygon points="168,158 178,168 168,178 158,168" fill="#ffffff"/>
  <!-- Sharp 45-Degree Metro Loupe Handle -->
  <polygon points="196,196 208,184 226,202 214,214" fill="url(#viewer-beam)"/>
</svg>
