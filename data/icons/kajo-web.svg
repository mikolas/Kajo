<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="web-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="web-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#00d8f0"/>
    </linearGradient>
  </defs>
  <!-- Metro sharp frame -->
  <rect x="8" y="8" width="240" height="240" fill="url(#web-bg)" stroke="#2b2b2b" stroke-width="4"/>
  <!-- Top-left Aero + Metro cobalt/cyan accent bar -->
  <path d="M 8 104 L 8 8 L 136 8" fill="none" stroke="#0078d4" stroke-width="6"/>
  <!-- Minimalist browser top bar + omnibar pill -->
  <rect x="28" y="28" width="200" height="26" fill="#141414" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="38" y="37" width="12" height="8" fill="#0078d4"/>
  <rect x="60" y="36" width="128" height="10" fill="#0d0d0d" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="198" y="36" width="20" height="10" fill="#107c10"/>
  <!-- Vertical autohide rail ticks on left -->
  <rect x="28" y="64" width="6" height="28" fill="#00d8f0"/>
  <rect x="28" y="98" width="6" height="20" fill="#3a3a3a"/>
  <rect x="28" y="124" width="6" height="20" fill="#3a3a3a"/>
  <!-- Geometric Metro globe wireframe -->
  <circle cx="136" cy="144" r="62" fill="none" stroke="url(#web-accent)" stroke-width="6"/>
  <ellipse cx="136" cy="144" rx="28" ry="62" fill="none" stroke="#00d8f0" stroke-width="4"/>
  <line x1="74" y1="144" x2="198" y2="144" stroke="#0078d4" stroke-width="4"/>
  <line x1="84" y1="114" x2="188" y2="114" stroke="#2b2b2b" stroke-width="3"/>
  <line x1="84" y1="174" x2="188" y2="174" stroke="#2b2b2b" stroke-width="3"/>
  <!-- Crisp compass diamond center -->
  <polygon points="136,126 150,144 136,162 122,144" fill="#ffffff"/>
</svg>
