<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Surface Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141d"/>
      <stop offset="100%" stop-color="#09090e"/>
    </linearGradient>

    <!-- Border Subtle Highlight -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c3d"/>
      <stop offset="50%" stop-color="#1b1b26"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>

    <!-- Electric Kajo Light Beam Gradient -->
    <linearGradient id="kajo-beam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="40%" stop-color="#0078d4"/>
      <stop offset="85%" stop-color="#00d8f0"/>
      <stop offset="100%" stop-color="#70e8ff"/>
    </linearGradient>

    <!-- Radial Glow Effect -->
    <radialGradient id="kajo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00d8f0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6"/>

  <!-- Radial Light Aura -->
  <circle cx="256" cy="256" r="180" fill="url(#kajo-glow)"/>

  <!-- Geometric Radiant K Emblem -->
  <g filter="url(#glow-shadow)">
    <!-- Vertical Spine Beam -->
    <path d="M156 128 L196 128 L196 384 L156 384 Z" fill="url(#kajo-beam)"/>

    <!-- Upper Diagonal Ray -->
    <path d="M196 272 L320 128 L376 128 L232 296 Z" fill="url(#kajo-beam)"/>

    <!-- Lower Diagonal Ray -->
    <path d="M220 280 L376 384 L320 384 L196 304 Z" fill="url(#kajo-beam)"/>

    <!-- Intersecting Laser Beam Accent Lines -->
    <path d="M156 384 L276 220 L312 248 L156 384 Z" fill="#00d8f0" opacity="0.3"/>
    <path d="M196 128 L376 332 L352 356 Z" fill="#70e8ff" opacity="0.2"/>
  </g>
</svg>
