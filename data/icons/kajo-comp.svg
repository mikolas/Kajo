<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="comp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="comp-beam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#00d8f0"/>
    </linearGradient>
  </defs>
  <!-- 0px Obsidian Outer Chassis -->
  <rect x="8" y="8" width="240" height="240" fill="url(#comp-bg)" stroke="#2b2b2b" stroke-width="4"/>
  <!-- Top-Left Aero Specular Edge Catch -->
  <path d="M 8 96 L 8 8 L 128 8" fill="none" stroke="#00d8f0" stroke-width="6"/>
  <!-- Infinite Horizontal Strip Viewport Rails -->
  <line x1="24" y1="42" x2="232" y2="42" stroke="#2b2b2b" stroke-width="3"/>
  <rect x="68" y="40" width="96" height="5" fill="#00d8f0"/>
  <line x1="24" y1="214" x2="232" y2="214" stroke="#2b2b2b" stroke-width="3"/>
  <!-- Left Off-Screen Peeking Column -->
  <rect x="24" y="56" width="32" height="144" fill="#1a1a1a" stroke="#383838" stroke-width="3"/>
  <rect x="24" y="56" width="32" height="16" fill="#2b2b2b"/>
  <!-- Center Active Focused Column (1px/3px Active Ring + Refracted Header) -->
  <rect x="68" y="56" width="96" height="144" fill="#141414"/>
  <rect x="68" y="56" width="96" height="24" fill="url(#comp-beam)"/>
  <rect x="68" y="56" width="96" height="144" fill="none" stroke="#00d8f0" stroke-width="4"/>
  <rect x="82" y="96" width="44" height="8" fill="#ffffff"/>
  <rect x="82" y="114" width="68" height="6" fill="#0078d4"/>
  <!-- Right Stacked 2-Window Column (Vertical Stack / Tabbed Strip) -->
  <rect x="176" y="56" width="56" height="66" fill="url(#comp-beam)"/>
  <rect x="186" y="68" width="28" height="6" fill="#ffffff"/>
  <rect x="176" y="134" width="56" height="66" fill="#1a1a1a"/>
  <rect x="176" y="134" width="56" height="12" fill="#00d8f0"/>
  <rect x="176" y="134" width="56" height="66" fill="none" stroke="#0078d4" stroke-width="3"/>
</svg>
