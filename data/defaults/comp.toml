# Kajo Compositor Configuration — Outputs, Input & Scrolling Layout

[layout]
gap_px = 6
border_px = 1
active_border_color = "accent"          # Tracks @metro-accent from theme.toml, or explicit "#0078d4"
inactive_border_color = "#2b2b2b"
urgent_border_color = "#e81123"
always_center_single_column = true
center_focused_column = "never"         # "never" | "on-overflow" | "always"
default_column_width = 0.5
preset_widths = [0.33333, 0.5, 0.66667]
preset_heights = [0.33333, 0.5, 0.66667, 1.0]

[animations]
enabled = true

[animations.workspace_switch]
damping_ratio = 0.80
stiffness = 523.0
epsilon = 0.0001

[animations.horizontal_scroll]
damping_ratio = 0.85
stiffness = 423.0
epsilon = 0.0001

[animations.window_movement]
damping_ratio = 0.75
stiffness = 323.0
epsilon = 0.0001

[animations.overview]
preset = "spring-bounce"                # "spring-bounce" | "spring-snappy" | "spring-elastic" | "spring-smooth" | "ease-out-back" | "ease-out-expo" | "instant" | "custom"
mode = "spring"                         # "spring" | "curve" | "instant"
damping_ratio = 0.62
stiffness = 380.0
epsilon = 0.0005
curve = "ease-out-back"                 # "ease-out-back" | "ease-out-expo" | "ease-out-cubic" | "ease-out-quad" | "linear"
duration_ms = 260
close_bounce_gain = 0.60

[effects]
enabled = true
dither = true
color_filter = "none"                   # "none" | "grayscale" | "night-light" | "protanopia" | "deuteranopia" | "tritanopia"
color_filter_strength = 1.0
night_light_temperature = 4000
sdr_white_nits = 0.0                    # 0.0 = default (203 cd/m^2 on HDR PQ), or 80.0..1000.0
tonemap = true
tonemap_peak_nits = 0.0                 # 0.0 = container max, or target panel peak (e.g. 616.9 cd/m^2)

[effects.glass]
enabled = true
style = "frosted"                       # "frosted" | "liquid" | "halation" | "fluted" | "acrylic" | "aero" | "dichroic"
passes = 3
offset = 2.0
saturation = 1.15
brightness = 0.90
tint = "#141414"
tint_alpha = 0.35
max_recompute_hz = 0
refraction = 0.45
dispersion = 0.25
bevel_px = 14.0
specular = 0.55
grain = 0.35
flute_px = 14.0
flute_axis = "vertical"                 # "vertical" | "horizontal"

[effects.shadow]
enabled = true
color = "#000000"
strength = 1.0
unfocused_scale = 0.60
duration_ms = 150

[[effects.shadow.layers]]
sigma = 6.0
offset_x = 0.0
offset_y = 2.0
opacity = 0.30

[[effects.shadow.layers]]
sigma = 24.0
offset_x = 0.0
offset_y = 8.0
opacity = 0.18

[effects.dim]
enabled = false
color = "#000000"
opacity = 0.15
duration_ms = 150

[effects.transitions]
enabled = true
open_preset = "default"
open_duration_ms = 150
open_curve = "ease-out-expo"
close_preset = "default"
close_duration_ms = 200
close_curve = "ease-out-quad"
resize_preset = "default"
resize_duration_ms = 180

[switcher]
active_border_color = "accent"
urgent_border_color = "#e81123"

[screenshots]
path = "~/Pictures/Screenshots/Screenshot from %Y-%m-%d %H-%M-%S.png"
copy_to_clipboard = true
show_notification = true
include_window_border = true

[xwayland]
enabled = true
force_zero_scaling = true

[env]
XDG_CURRENT_DESKTOP = "kajo"
ELECTRON_OZONE_PLATFORM_HINT = "auto"

[autostart]
commands = [
    ["gnome-keyring-daemon", "--start", "--components=secrets"],
    ["/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1"],
    ["kajo"],
]

[input.keyboard]
xkb_layout = "us"                       # Or comma-separated "us,fi"
xkb_options = ""
numlock_on_startup = true
repeat_rate = 35
repeat_delay = 250

[input.touchpad]
tap = true
natural_scroll = true
dwt = true

[input.mouse]
accel_profile = "flat"
accel_speed = 0.0
natural_scroll = false

# ─── Host Profile A: HP OmniBook X Flip 14 OLED (matched case-insensitively by EDID Make/Model or "edp-1") ───
[[output]]
match = "samsung display corp. 0x41aa"
mode = "2880x1800@120.001"
scale = 1.75
transform = "normal"
vrr = "on"

# ─── Host Profile B: 34" Ultrawide Desktop Monitor (matched case-insensitively by connector or EDID Make/Model) ───
[[output]]
match = "dp-1"
mode = "preferred"
scale = 1.0
transform = "normal"
vrr = "on-demand"                       # Engages adaptive sync only for fullscreen windows or vrr=true rules
