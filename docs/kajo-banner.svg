<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Obsidian Canvas Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="55%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <!-- Emblem Chassis Gradient -->
    <linearGradient id="emblem-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>

    <!-- Upper Refracted Beam (Metro Blue -> Aero Cyan) -->
    <linearGradient id="kajo-beam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#00d8f0"/>
    </linearGradient>

    <!-- Lower Refracted Beam (Aero Cyan -> Metro Blue) -->
    <linearGradient id="kajo-lower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8f0"/>
      <stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>

    <!-- Ambient Diagonal Light Wash -->
    <linearGradient id="ambient-ray" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#00d8f0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00d8f0" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Horizon Divider Gradient -->
    <linearGradient id="horizon-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d8f0"/>
      <stop offset="35%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>

    <!-- 40px Technical Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#171717" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 1. Outer 1200x400 0px Obsidian Frame -->
  <rect x="0" y="0" width="1200" height="400" fill="url(#banner-bg)"/>
  <rect x="0" y="0" width="1200" height="400" fill="url(#tech-grid)"/>

  <!-- Ambient Refracted Light Cone -->
  <polygon points="336,200 1200,0 1200,400" fill="url(#ambient-ray)"/>

  <!-- Structural Perimeter Border (1px / 2px) -->
  <rect x="1" y="1" width="1198" height="398" fill="none" stroke="#2b2b2b" stroke-width="2"/>

  <!-- Top-Left & Bottom-Right Aero Specular Corner Catches -->
  <path d="M 2 140 L 2 2 L 260 2" fill="none" stroke="#0078d4" stroke-width="4"/>
  <path d="M 2 56 L 2 2 L 72 2" fill="none" stroke="#00d8f0" stroke-width="4"/>
  <path d="M 1198 280 L 1198 398 L 960 398" fill="none" stroke="#0078d4" stroke-width="3"/>

  <!-- Top Technical Telemetry Bar -->
  <g font-family="'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace" font-size="11" font-weight="600" letter-spacing="1.5">
    <text x="408" y="44" fill="#666666">SYS // ORG.KAJO.SUITE</text>
    <rect x="932" y="27" width="212" height="24" fill="#141414" stroke="#2b2b2b" stroke-width="1"/>
    <rect x="932" y="27" width="4" height="24" fill="#00d8f0"/>
    <text x="946" y="43" fill="#00d8f0">[ AERO + METRO • 0PX ]</text>
  </g>

  <!-- 2. Left Hero Emblem: Concept A (The Refracted Prism "K") -->
  <!-- Scaled to 280x280 at (x=64, y=60) -->
  <g transform="translate(64, 60)">
    <!-- Emblem Chassis -->
    <rect x="0" y="0" width="280" height="280" fill="url(#emblem-bg)" stroke="#2b2b2b" stroke-width="2"/>
    <!-- Top-Left Aero Specular Edge Catch -->
    <path d="M 0 104 L 0 0 L 148 0" fill="none" stroke="#0078d4" stroke-width="5"/>
    <path d="M 0 36 L 0 0 L 36 0" fill="none" stroke="#00d8f0" stroke-width="5"/>

    <!-- Subtle Internal Crosshair Grid -->
    <line x1="2" y1="140" x2="278" y2="140" stroke="#1e1e1e" stroke-width="1.5"/>
    <line x1="100" y1="2" x2="100" y2="278" stroke="#1e1e1e" stroke-width="1.5"/>

    <!-- Left Structural Monolith Pillar -->
    <polygon points="56,46 94,46 94,234 56,234" fill="#f2f2f2"/>
    <!-- Precision Cyan Horizon Slit in Pillar -->
    <rect x="56" y="135" width="38" height="10" fill="#00d8f0"/>

    <!-- Upper 45° Refracted Light Blade -->
    <polygon points="108,135 197,46 240,46 136,150" fill="url(#kajo-beam)"/>
    <!-- Lower 45° Refracted Light Blade (Separated by geometric air gap) -->
    <polygon points="146,154 240,234 192,234 108,160" fill="url(#kajo-lower)"/>
    <!-- Specular Core Spark -->
    <polygon points="108,135 136,150 108,150" fill="#ffffff"/>
  </g>

  <!-- 3. Pure Geometric Vector Wordmark: "KAJO // OS" (Font-Independent) -->
  <g transform="translate(408, 84)">
    <!-- Letter 'K' (x=0..84, y=0..104) -->
    <polygon points="0,0 22,0 22,104 0,104" fill="#ffffff"/>
    <rect x="0" y="48" width="22" height="6" fill="#00d8f0"/>
    <polygon points="28,48 72,0 96,0 44,56" fill="#ffffff"/>
    <polygon points="50,60 96,104 70,104 28,64" fill="#ffffff"/>

    <!-- Letter 'A' (x=114..210, y=0..104) -->
    <polygon points="150,0 174,0 214,104 190,104 162,26 134,104 110,104" fill="#ffffff"/>
    <!-- Refracted Cyan Crossbar on 'A' -->
    <polygon points="132,64 192,64 198,80 126,80" fill="url(#kajo-beam)"/>

    <!-- Letter 'J' (x=232..312, y=0..104) -->
    <polygon points="256,0 312,0 312,20 296,20 296,82 274,104 232,104 232,74 252,74 252,84 266,84 274,76 274,20 256,20" fill="#ffffff"/>

    <!-- Letter 'O' (x=336..432, y=0..104) — Sharp 0px Monolith Ring with Cyan Notch -->
    <path d="M 336 0 L 432 0 L 432 104 L 336 104 Z M 358 20 L 358 84 L 410 84 L 410 20 Z" fill="#ffffff" fill-rule="evenodd"/>
    <rect x="336" y="48" width="22" height="8" fill="#00d8f0"/>

    <!-- Refracted Double Slash '//' (x=462..546, y=0..104) -->
    <polygon points="494,0 512,0 476,104 458,104" fill="#00d8f0"/>
    <polygon points="524,0 542,0 506,104 488,104" fill="#0078d4"/>

    <!-- Right-Side Architecture Spec Callout -->
    <g transform="translate(568, 8)" font-family="'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace">
      <rect x="0" y="0" width="168" height="28" fill="#0078d4"/>
      <text x="14" y="19" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="2">NATIVE SUITE</text>
      <text x="2" y="54" fill="#e6e6e6" font-size="13" font-weight="700" letter-spacing="1.2">C17 • GTK4 • WAYLAND</text>
      <text x="2" y="76" fill="#888888" font-size="11" letter-spacing="1">NIRI • PIPEWIRE • GLSL</text>
    </g>
  </g>

  <!-- 4. Horizon Divider Line & Tagline -->
  <rect x="408" y="214" width="736" height="2" fill="url(#horizon-line)"/>
  <rect x="408" y="213" width="64" height="4" fill="#00d8f0"/>

  <text x="408" y="246" fill="#b8b8b8" font-family="'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace" font-size="13" font-weight="600" letter-spacing="2.2">
    AERO + METRO PERSONAL APPLICATION SUITE &amp; WAYLAND ENVIRONMENT
  </text>

  <!-- 5. Bottom 6-Binary Suite Telemetry Strip (x=408..1144, y=272..340) -->
  <g transform="translate(408, 272)" font-family="'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace">

    <!-- 01: kajo (Shell) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="114" height="68" fill="#141414" stroke="#2b2b2b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="48" y2="0" stroke="#0078d4" stroke-width="3"/>
      <polygon points="14,16 19,16 19,36 14,36" fill="#ffffff"/>
      <polygon points="21,25 30,16 35,16 25,27" fill="#00d8f0"/>
      <polygon points="26,28 35,36 29,36 21,29" fill="#0078d4"/>
      <text x="44" y="25" fill="#666666" font-size="10" font-weight="700">01//</text>
      <text x="14" y="54" fill="#f0f0f0" font-size="11" font-weight="700" letter-spacing="0.8">KAJO SHELL</text>
    </g>

    <!-- 02: kajo-ide -->
    <g transform="translate(124, 0)">
      <rect x="0" y="0" width="114" height="68" fill="#141414" stroke="#2b2b2b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="48" y2="0" stroke="#00d8f0" stroke-width="3"/>
      <polygon points="14,17 24,25 14,33 14,29 19,25 14,21" fill="#00d8f0"/>
      <rect x="27" y="17" width="8" height="17" fill="#dcdcaa"/>
      <text x="44" y="25" fill="#666666" font-size="10" font-weight="700">02//</text>
      <text x="14" y="54" fill="#f0f0f0" font-size="11" font-weight="700" letter-spacing="0.8">KAJO IDE</text>
    </g>

    <!-- 03: kajo-files -->
    <g transform="translate(248, 0)">
      <rect x="0" y="0" width="114" height="68" fill="#141414" stroke="#2b2b2b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="48" y2="0" stroke="#0078d4" stroke-width="3"/>
      <polygon points="14,16 23,16 26,20 36,20 36,35 14,35" fill="#0078d4"/>
      <rect x="14" y="22" width="22" height="3" fill="#00d8f0"/>
      <text x="44" y="25" fill="#666666" font-size="10" font-weight="700">03//</text>
      <text x="14" y="54" fill="#f0f0f0" font-size="11" font-weight="700" letter-spacing="0.8">KAJO FILES</text>
    </g>

    <!-- 04: kajo-player -->
    <g transform="translate(372, 0)">
      <rect x="0" y="0" width="114" height="68" fill="#141414" stroke="#2b2b2b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="48" y2="0" stroke="#c586c0" stroke-width="3"/>
      <polygon points="14,16 28,25 14,35" fill="#00d8f0"/>
      <rect x="31" y="21" width="3" height="14" fill="#c586c0"/>
      <rect x="36" y="16" width="3" height="19" fill="#0078d4"/>
      <text x="44" y="25" fill="#666666" font-size="10" font-weight="700">04//</text>
      <text x="14" y="54" fill="#f0f0f0" font-size="11" font-weight="700" letter-spacing="0.8">KAJO PLAYER</text>
    </g>

    <!-- 05: kajo-settings -->
    <g transform="translate(496, 0)">
      <rect x="0" y="0" width="114" height="68" fill="#141414" stroke="#2b2b2b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="48" y2="0" stroke="#0078d4" stroke-width="3"/>
      <rect x="14" y="18" width="22" height="3" fill="#0078d4"/>
      <rect x="28" y="15" width="4" height="9" fill="#ffffff"/>
      <rect x="14" y="29" width="22" height="3" fill="#00d8f0"/>
      <rect x="19" y="26" width="4" height="9" fill="#ffffff"/>
      <text x="44" y="25" fill="#666666" font-size="10" font-weight="700">05//</text>
      <text x="14" y="54" fill="#f0f0f0" font-size="11" font-weight="700" letter-spacing="0.8">SETTINGS</text>
    </g>

    <!-- 06: kajo-greeter -->
    <g transform="translate(620, 0)">
      <rect x="0" y="0" width="116" height="68" fill="#141414" stroke="#2b2b2b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="48" y2="0" stroke="#4ec9b0" stroke-width="3"/>
      <rect x="19" y="15" width="12" height="8" fill="none" stroke="#e6e6e6" stroke-width="2.5"/>
      <rect x="15" y="23" width="20" height="13" fill="#0078d4"/>
      <rect x="23" y="26" width="4" height="7" fill="#00d8f0"/>
      <text x="44" y="25" fill="#666666" font-size="10" font-weight="700">06//</text>
      <text x="14" y="54" fill="#f0f0f0" font-size="11" font-weight="700" letter-spacing="0.8">GREETER</text>
    </g>

  </g>
</svg>
