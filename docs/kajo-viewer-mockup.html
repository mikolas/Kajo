<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAJO VIEWER — Aero + Metro Interactive UI Mockup</title>
  <style>
    /* ==========================================================================
       KAJO "AERO + METRO" DESIGN TOKENS (Strict 0px Corner Radius)
       ========================================================================== */
    :root {
      --metro-accent: #0078d4;
      --metro-accent-hover: #1084df;
      --metro-accent-rgb: 0, 120, 212;
      --metro-telemetry: #00d8f0;
      --metro-success: #10893e;
      --metro-warning: #ff8c00;
      --metro-urgent: #e81123;
      --metro-urgent-text: #ff6b6b;

      --surface-0: #101010;
      --surface-1: #121212;
      --surface-bg: #141414;
      --surface-2: #161616;
      --surface-3: #181818;
      --surface-4: #1a1a1a;
      --surface-hover: #222222;
      --surface-active: #2a2a2a;

      --border-subtle: #242424;
      --border-struct: #2b2b2b;
      --border-strong: #333333;

      --text-primary: #ffffff;
      --text-bright: #f0f0f0;
      --text-soft: #e0e0e0;
      --text-body: #cccccc;
      --text-secondary: #a0a0a0;
      --text-muted: #999999;
      --text-dim: #777777;

      --font-mono: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace;
      --font-sans: 'Inter', 'Cantarell', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
      border-radius: 0 !important;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #070707;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    button, input {
      font-family: var(--font-mono);
      outline: none;
      color: inherit;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
      background: var(--surface-0);
    }
    ::-webkit-scrollbar-thumb {
      background: #333333;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--metro-accent);
    }

    /* ==========================================================================
       DEMO STAGE SWITCHER BAR (Outside App Chrome)
       ========================================================================== */
    .demo-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
    }

    .demo-bar {
      height: 30px;
      flex-shrink: 0;
      background: #0b0b0b;
      border-bottom: 1px solid #222222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 11px;
      color: var(--text-muted);
      gap: 10px;
      user-select: none;
    }

    .demo-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .demo-lbl {
      font-size: 10px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-right: 4px;
    }

    .demo-btn {
      background: #151515;
      border: 1px solid #2b2b2b;
      color: var(--text-secondary);
      padding: 2px 8px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .demo-btn:hover {
      background: #222222;
      border-color: var(--metro-accent);
      color: #ffffff;
    }
    .demo-btn.active {
      background: var(--metro-accent);
      border-color: var(--metro-accent);
      color: #ffffff;
    }

    .swatch-dot {
      width: 14px;
      height: 14px;
      border: 1px solid #333333;
      cursor: pointer;
    }
    .swatch-dot.active {
      border: 1px solid #ffffff;
      box-shadow: inset 0 0 0 2px #0b0b0b;
    }

    .niri-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      background: radial-gradient(circle at 20% 0%, rgba(var(--metro-accent-rgb), 0.10), transparent 48%), #070707;
      transition: padding 120ms ease;
    }
    .niri-stage.floating {
      padding: 16px 24px;
    }

    /* ==========================================================================
       FRAMELESS KAJO VIEWER WINDOW (.shell-settings-window.shell-viewer-window)
       ========================================================================== */
    .viewer-window {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface-bg);
      border: 1px solid var(--metro-accent);
      overflow: hidden;
    }
    .niri-stage.floating .viewer-window {
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
    }

    /* 1. Top Window Header Bar (34px) */
    .viewer-header {
      height: 34px;
      flex-shrink: 0;
      background: var(--surface-3);
      border-bottom: 1px solid var(--border-struct);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 10px;
      gap: 8px;
      user-select: none;
    }

    .hdr-left, .hdr-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .hdr-brand {
      font-weight: 800;
      font-size: 11.5px;
      letter-spacing: 0.9px;
      color: var(--text-primary);
      padding-right: 10px;
      border-right: 1px solid var(--border-struct);
      white-space: nowrap;
    }

    .hdr-filename {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metro-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      background: var(--surface-0);
      border: 1px solid var(--border-struct);
      color: var(--metro-telemetry);
      white-space: nowrap;
    }
    .metro-badge.live {
      color: #4cd964;
      border-color: rgba(16, 137, 62, 0.55);
    }
    .metro-badge.warn {
      color: var(--metro-warning);
      border-color: rgba(255, 140, 0, 0.55);
    }

    .hdr-btn {
      height: 24px;
      padding: 0 9px;
      background: var(--surface-4);
      border: 1px solid var(--border-struct);
      color: var(--text-soft);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .hdr-btn:hover {
      background: var(--surface-hover);
      border-color: var(--metro-accent);
      color: #ffffff;
    }
    .hdr-btn.close {
      width: 28px;
      justify-content: center;
      padding: 0;
    }
    .hdr-btn.close:hover {
      background: var(--metro-urgent);
      border-color: var(--metro-urgent);
      color: #ffffff;
    }

    /* 2. Contextual Mode Ribbon (36px) */
    .mode-ribbon {
      height: 36px;
      flex-shrink: 0;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-struct);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      gap: 8px;
      overflow-x: auto;
      user-select: none;
    }

    .ribbon-left, .ribbon-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ribbon-sep {
      width: 1px;
      height: 20px;
      background: var(--border-struct);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .tool-btn {
      height: 24px;
      padding: 0 8px;
      background: var(--surface-4);
      border: 1px solid var(--border-struct);
      color: var(--text-body);
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .tool-btn:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--metro-accent);
      color: #ffffff;
    }
    .tool-btn.active {
      background: rgba(var(--metro-accent-rgb), 0.22);
      border-color: var(--metro-accent);
      color: #ffffff;
    }
    .tool-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .seg-group {
      display: inline-flex;
      border: 1px solid var(--border-strong);
      background: var(--surface-0);
    }
    .seg-btn {
      height: 22px;
      padding: 0 8px;
      background: transparent;
      border: none;
      border-right: 1px solid var(--border-struct);
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
    }
    .seg-btn:last-child {
      border-right: none;
    }
    .seg-btn:hover {
      background: var(--surface-hover);
      color: #ffffff;
    }
    .seg-btn.active {
      background: var(--metro-accent);
      color: #ffffff;
    }

    .page-jump-input {
      width: 38px;
      height: 24px;
      background: var(--surface-0);
      border: 1px solid var(--border-strong);
      color: #ffffff;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
    }
    .page-jump-input:focus {
      border-color: var(--metro-accent);
    }

    /* 3. Workspace Body (Sidebar + Main Stack) */
    .viewer-body {
      flex: 1;
      min-height: 0;
      display: flex;
      background: var(--surface-0);
    }

    /* Collapsible 240px Left Sidebar */
    .viewer-sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--surface-1);
      border-right: 1px solid var(--border-struct);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .viewer-sidebar.hidden {
      display: none;
    }

    .sidebar-header {
      padding: 7px 8px;
      background: var(--surface-3);
      border-bottom: 1px solid var(--border-struct);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .sidebar-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .toc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 7px;
      border-left: 3px solid transparent;
      color: var(--text-body);
      font-size: 11px;
      cursor: pointer;
    }
    .toc-item:hover {
      background: var(--surface-hover);
      color: #ffffff;
    }
    .toc-item.active {
      background: var(--surface-4);
      border-left-color: var(--metro-accent);
      color: #ffffff;
      font-weight: 700;
    }
    .toc-item.lvl-2 { padding-left: 16px; color: var(--text-secondary); }
    .toc-item.lvl-3 { padding-left: 25px; color: var(--text-muted); font-size: 10.5px; }
    .toc-page {
      color: var(--text-dim);
      font-size: 10px;
      flex-shrink: 0;
    }

    .thumb-card {
      border: 1px solid var(--border-struct);
      background: var(--surface-3);
      padding: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .thumb-card:hover {
      border-color: var(--border-strong);
      background: var(--surface-4);
    }
    .thumb-card.active {
      border-color: var(--metro-accent);
      box-shadow: inset 3px 0 0 var(--metro-accent);
    }
    .thumb-preview {
      width: 116px;
      height: 152px;
      background: #ffffff;
      border: 1px solid #444444;
      padding: 10px;
      color: #222222;
      font-family: var(--font-sans);
      font-size: 6px;
      line-height: 1.4;
      overflow: hidden;
    }
    .thumb-label {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .meta-section {
      border: 1px solid var(--border-struct);
      background: var(--surface-3);
      margin-bottom: 8px;
    }
    .meta-head {
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      color: var(--metro-telemetry);
      background: var(--surface-4);
      border-bottom: 1px solid var(--border-subtle);
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 8px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 10.5px;
    }
    .meta-row:last-child { border-bottom: none; }
    .meta-k { color: var(--text-muted); }
    .meta-v { color: var(--text-bright); font-weight: 600; text-align: right; }

    /* Main Content Column */
    .viewer-main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface-0);
    }

    /* Inline Opt-In Find Bar / Encrypted PDF Prompt */
    .inline-bar {
      height: 34px;
      flex-shrink: 0;
      background: var(--surface-3);
      border-bottom: 1px solid var(--border-struct);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      gap: 8px;
    }
    .inline-bar.hidden {
      display: none;
    }
    .inline-bar.warn {
      background: rgba(255, 140, 0, 0.10);
      border-bottom-color: rgba(255, 140, 0, 0.55);
    }

    .find-input {
      width: 240px;
      height: 24px;
      padding: 0 8px;
      background: var(--surface-0);
      border: 1px solid var(--border-strong);
      color: #ffffff;
      font-size: 11px;
    }
    .find-input:focus {
      border-color: var(--metro-accent);
    }

    /* Viewport Canvas */
    .canvas-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      background: var(--surface-0);
    }

    /* --- PDF PAGE RENDERING --- */
    .pdf-spread-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      justify-content: center;
    }

    .pdf-sheet {
      width: 560px;
      min-height: 740px;
      background: #ffffff;
      color: #16181d;
      border: 1px solid #303030;
      padding: 42px 46px;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.62;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      transform-origin: top center;
      transition: background 140ms ease, color 140ms ease, transform 120ms ease;
    }
    .pdf-sheet.sepia {
      background: #f4ecd8;
      color: #2b2419;
      border-color: #6b5e49;
    }
    .pdf-sheet.dark {
      background: #17191d;
      color: #dcdcdc;
      border-color: #2b2b2b;
    }
    .pdf-sheet.selected-page {
      outline: 2px solid var(--metro-accent);
      outline-offset: 2px;
    }

    .pdf-hdr-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      color: #6a737d;
      padding-bottom: 8px;
      margin-bottom: 18px;
      border-bottom: 1px solid #d0d7de;
    }
    .pdf-sheet.dark .pdf-hdr-meta {
      color: #888888;
      border-bottom-color: #2b2b2b;
    }

    .pdf-sheet h1 { font-size: 21px; margin-bottom: 10px; font-weight: 800; }
    .pdf-sheet h2 { font-size: 15px; margin: 18px 0 8px; font-weight: 700; color: #005a9e; }
    .pdf-sheet.dark h2 { color: #56b6ff; }
    .pdf-sheet p { margin-bottom: 10px; }
    .pdf-callout {
      border-left: 3px solid var(--metro-accent);
      background: rgba(0, 120, 212, 0.08);
      padding: 10px 12px;
      margin: 14px 0;
      font-size: 12px;
    }
    .pdf-diagram-box {
      border: 1px solid #c8d1da;
      background: #f6f8fa;
      padding: 12px;
      margin: 14px 0;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .pdf-sheet.dark .pdf-diagram-box {
      background: #111317;
      border-color: #2b2b2b;
    }
    .find-hl {
      background: rgba(255, 185, 0, 0.55);
      color: #000000;
      padding: 0 1px;
    }
    .find-hl.active {
      background: var(--metro-accent);
      color: #ffffff;
    }

    /* --- MARKDOWN DOCUMENT VIEW (Shared KajoMarkdownView Aesthetic) --- */
    .md-doc {
      width: 100%;
      max-width: 860px;
      background: var(--surface-1);
      border: 1px solid var(--border-struct);
      padding: 28px 34px;
      font-family: var(--font-sans);
      color: var(--text-bright);
      line-height: 1.6;
    }
    .md-doc.narrow { max-width: 680px; }
    .md-doc.comfort { max-width: 860px; }
    .md-doc.full { max-width: none; }

    .md-doc h1 {
      font-family: var(--font-mono);
      font-size: 1.55em;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--metro-accent);
      margin-bottom: 16px;
    }
    .md-doc h2 {
      font-family: var(--font-mono);
      font-size: 1.18em;
      color: var(--metro-telemetry);
      margin: 22px 0 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-struct);
    }
    .md-doc h3 {
      font-family: var(--font-mono);
      font-size: 1.0em;
      color: var(--text-soft);
      margin: 16px 0 8px;
    }
    .md-doc p { margin-bottom: 10px; color: var(--text-body); }
    .md-doc a.md-link {
      color: #4aa8ff;
      text-decoration: underline;
      cursor: pointer;
    }
    .md-doc code {
      font-family: var(--font-mono);
      background: var(--surface-3);
      border: 1px solid var(--border-subtle);
      padding: 1px 4px;
      font-size: 0.88em;
      color: #dcdcaa;
    }

    .md-code-block {
      background: var(--surface-0);
      border: 1px solid var(--border-struct);
      border-left: 3px solid var(--metro-accent);
      padding: 10px 12px;
      margin: 12px 0;
      font-family: var(--font-mono);
      font-size: 0.85em;
      color: #cccccc;
      overflow-x: auto;
      line-height: 1.5;
    }

    .md-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9em;
    }
    .md-table th, .md-table td {
      border: 1px solid var(--border-struct);
      padding: 6px 10px;
      text-align: left;
    }
    .md-table th {
      background: var(--surface-3);
      font-family: var(--font-mono);
      font-size: 0.85em;
      color: var(--metro-telemetry);
    }
    .md-table tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.015);
    }

    .md-checklist {
      list-style: none;
      margin: 10px 0;
    }
    .md-checklist li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .md-check-box {
      width: 15px;
      height: 15px;
      border: 1px solid var(--border-strong);
      background: var(--surface-0);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
    }
    .md-check-box.checked {
      background: var(--metro-accent);
      border-color: var(--metro-accent);
      color: #ffffff;
    }
    .md-check-box.readonly {
      opacity: 0.72;
      cursor: not-allowed;
    }

    .mermaid-card {
      background: var(--surface-0);
      border: 1px solid var(--border-struct);
      margin: 14px 0;
    }
    .mermaid-card-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      background: var(--surface-3);
      border-bottom: 1px solid var(--border-struct);
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--metro-telemetry);
    }

    .md-raw-pre {
      width: 100%;
      max-width: 960px;
      background: var(--surface-1);
      border: 1px solid var(--border-struct);
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #d4d4d4;
      white-space: pre-wrap;
      line-height: 1.55;
    }

    /* --- IMAGE VIEWER CANVAS & FILMSTRIP --- */
    .image-stage {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--surface-0);
    }

    .image-viewport {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: grab;
      user-select: none;
    }
    .image-viewport:active {
      cursor: grabbing;
    }

    .image-frame {
      border: 1px solid var(--border-struct);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
      transition: transform 110ms ease;
      background: #141414;
    }
    .image-frame.checkerboard {
      background-image:
        linear-gradient(45deg, #222222 25%, transparent 25%),
        linear-gradient(-45deg, #222222 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #222222 75%),
        linear-gradient(-45deg, transparent 75%, #222222 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #161616;
    }

    .filmstrip {
      height: 76px;
      flex-shrink: 0;
      background: var(--surface-2);
      border-top: 1px solid var(--border-struct);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      overflow-x: auto;
    }
    .filmstrip.hidden {
      display: none;
    }
    .film-thumb {
      width: 92px;
      height: 58px;
      flex-shrink: 0;
      background: var(--surface-4);
      border: 1px solid var(--border-struct);
      padding: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 9.5px;
      color: var(--text-secondary);
    }
    .film-thumb:hover {
      border-color: var(--border-strong);
      color: #ffffff;
    }
    .film-thumb.active {
      border-color: var(--metro-accent);
      box-shadow: inset 0 -3px 0 var(--metro-accent);
      color: #ffffff;
      font-weight: 700;
    }

    /* --- EMPTY / DROP ZONE --- */
    .empty-drop {
      width: 520px;
      margin: auto;
      padding: 36px 28px;
      background: var(--surface-3);
      border: 1px dashed var(--border-strong);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }
    .empty-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
    .empty-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
    }
    .format-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    /* 4. Bottom Telemetry Strip (26px) */
    .status-strip {
      height: 26px;
      flex-shrink: 0;
      background: var(--surface-3);
      border-top: 1px solid var(--border-struct);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 10.5px;
      color: var(--text-secondary);
      user-select: none;
    }
    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-accent {
      color: var(--metro-telemetry);
      font-weight: 700;
    }
  </style>
</head>
<body>
<div class="demo-shell">
  <!-- Subtle outside-chrome interactive prototype controller -->
  <div class="demo-bar">
    <div class="demo-group">
      <span class="demo-lbl">MOCKUP MODE:</span>
      <button class="demo-btn active" data-mode="pdf" onclick="setMode('pdf')">PDF DOCUMENT</button>
      <button class="demo-btn" data-mode="markdown" onclick="setMode('markdown')">MARKDOWN + MERMAID</button>
      <button class="demo-btn" data-mode="image" onclick="setMode('image')">IMAGE (RASTER)</button>
      <button class="demo-btn" data-mode="svg" onclick="setMode('svg')">IMAGE (VECTOR SVG)</button>
      <button class="demo-btn" data-mode="empty" onclick="setMode('empty')">EMPTY / DROP</button>
    </div>
    <div class="demo-group">
      <button class="demo-btn" id="btnLockDemo" onclick="toggleEncryptedDemo()">LOCKED PDF PROMPT</button>
      <button class="demo-btn" id="btnStageMode" onclick="toggleStageFloating()">FLOATING</button>
      <span class="demo-lbl" style="margin-left: 6px;">ACCENT:</span>
      <button class="swatch-dot active" style="background:#0078d4" onclick="setAccent('#0078d4','0, 120, 212',this)" title="Cobalt"></button>
      <button class="swatch-dot" style="background:#00b7c3" onclick="setAccent('#00b7c3','0, 183, 195',this)" title="Cyan"></button>
      <button class="swatch-dot" style="background:#10893e" onclick="setAccent('#10893e','16, 137, 62',this)" title="Emerald"></button>
      <button class="swatch-dot" style="background:#ff8c00" onclick="setAccent('#ff8c00','255, 140, 0',this)" title="Amber"></button>
      <button class="swatch-dot" style="background:#b4009e" onclick="setAccent('#b4009e','180, 0, 158',this)" title="Magenta"></button>
    </div>
  </div>

  <div class="niri-stage" id="niriStage">
    <div class="viewer-window">
      <!-- 1. Frameless Aero + Metro Header Bar -->
      <div class="viewer-header">
        <div class="hdr-left">
          <div class="hdr-brand">▤ KAJO VIEWER</div>
          <div class="hdr-filename" id="hdrFilename">spec_comp_effects.pdf</div>
          <div class="metro-badge" id="hdrBadge">PDF · 12 PAGES · 2.4 MB</div>
        </div>
        <div class="hdr-right">
          <button class="hdr-btn" onclick="setMode('empty')" title="Open File (Ctrl+O)">📂 OPEN</button>
          <button class="hdr-btn" onclick="toggleStageFloating()" title="Toggle Float / Tile">🗗 FLOAT / TILE</button>
          <button class="hdr-btn close" title="Close">✕</button>
        </div>
      </div>

      <!-- 2. Contextual Mode Ribbon -->
      <div class="mode-ribbon" id="modeRibbon"></div>

      <!-- 3. Workspace Body -->
      <div class="viewer-body">
        <!-- Collapsible Left Sidebar -->
        <aside class="viewer-sidebar" id="viewerSidebar"></aside>

        <!-- Main Document / Image Area -->
        <main class="viewer-main">
          <!-- Opt-in Find Bar (Ctrl+F) -->
          <div class="inline-bar hidden" id="findBar">
            <div class="demo-group">
              <span style="color:var(--metro-telemetry);font-weight:700;">🔍 FIND</span>
              <input class="find-input" id="findInput" value="Vulkan" oninput="updateFind()" placeholder="Search document..." />
              <span id="findCount" style="color:var(--text-secondary);font-size:11px;min-width:68px;">2 / 4</span>
              <button class="tool-btn" onclick="stepFind(-1)">▲</button>
              <button class="tool-btn" onclick="stepFind(1)">▼</button>
            </div>
            <button class="tool-btn" onclick="toggleFind()">✕ CLOSE</button>
          </div>

          <!-- Inline Encrypted PDF Password Bar (demo toggleable) -->
          <div class="inline-bar warn hidden" id="lockBar">
            <div class="demo-group">
              <span style="color:var(--metro-warning);font-weight:700;">🔒 ENCRYPTED PDF</span>
              <input class="find-input" id="pdfPassInput" type="password" placeholder="Enter document password..." />
              <button class="tool-btn active" onclick="unlockEncryptedDemo()">UNLOCK</button>
            </div>
            <span style="font-size:10.5px;color:var(--text-secondary);">explicit_bzero() scrubs buffer before Poppler call</span>
          </div>

          <div class="canvas-scroll" id="canvasArea"></div>

          <div class="filmstrip hidden" id="imageFilmstrip"></div>
        </main>
      </div>

      <!-- 4. Bottom Telemetry Strip -->
      <div class="status-strip" id="statusStrip"></div>
    </div>
  </div>
</div>

<script>
const state = {
  mode: 'pdf',
  sidebarOpen: true,
  findOpen: false,
  findQuery: 'Vulkan',
  findIdx: 0,
  encryptedDemo: false,
  floating: false,

  /* PDF state */
  pdfTab: 'outline',
  pdfPage: 2,
  pdfTotal: 12,
  pdfSpread: 'single',
  pdfZoom: 100,
  pdfTone: 'paper',
  pdfRot: 0,

  /* Markdown state */
  mdWidth: 'comfort',
  mdFontPct: 100,
  mdRaw: false,
  mdHistoryIdx: 1,
  mdChecks: [true, true, false, false],

  /* Image state */
  imgIndex: 0,
  imgZoom: 100,
  imgRot: 0,
  imgFlipH: false,
  imgChecker: false,
  imgFilmstrip: false,
  imgPanX: 0,
  imgPanY: 0,
};

const pdfOutline = [
  { title: '1. Compositor Effects Architecture', page: 1, lvl: 1 },
  { title: '1.1 Linear-Light Vulkan Pipeline', page: 2, lvl: 2 },
  { title: '1.2 Damage-Gated Offscreen Targets', page: 4, lvl: 2 },
  { title: '2. Dual-Filter Kawase Glass', page: 6, lvl: 1 },
  { title: '2.1 Blur Down/Up Shaders', page: 7, lvl: 2 },
  { title: '3. Analytical SDF Drop Shadows', page: 9, lvl: 1 },
  { title: '4. HDR10 & BT.2390 Tone Mapping', page: 11, lvl: 1 },
];

const mdOutline = [
  { title: 'Kajo Suite Architecture & Roadmap', id: 'sec1', lvl: 1 },
  { title: '1. Completed Desktop Pillars', id: 'sec2', lvl: 2 },
  { title: '2. kajo-viewer Milestones', id: 'sec3', lvl: 2 },
  { title: '3. Rendering Data Flow (Mermaid)', id: 'sec4', lvl: 2 },
];

const galleryImages = [
  { name: '01_omnibook_oled_calibration.png', kind: 'RASTER', res: '2880×1800', size: '3.1 MB', decoder: 'GLYCIN · PNG', camera: 'Wayland Capture · eDP-1', profile: 'Display P3 (ICC)', exposure: '8-bit RGBA · 616 cd/m²' },
  { name: '02_sunset_hdr_sample.avif', kind: 'RASTER', res: '3840×2160', size: '1.4 MB', decoder: 'GLYCIN · AVIF', camera: 'Sony ILCE-7M4 · 35mm', exposure: 'f/2.8 · 1/500s · ISO 100' },
  { name: '03_kajo_comp_scene_diagram.svg', kind: 'SVG', res: '1200×720 (Vector)', size: '18 KB', decoder: 'LIBRSVG · VECTOR', camera: 'Vector Graphics · Scalable', profile: 'sRGB SVG 1.1', exposure: 'Infinite Zoom (No Pixelation)' },
];

function setAccent(hex, rgb, btn) {
  document.documentElement.style.setProperty('--metro-accent', hex);
  document.documentElement.style.setProperty('--metro-accent-rgb', rgb);
  document.querySelectorAll('.swatch-dot').forEach(el => el.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function toggleStageFloating() {
  state.floating = !state.floating;
  document.getElementById('niriStage').classList.toggle('floating', state.floating);
  document.getElementById('btnStageMode').classList.toggle('active', state.floating);
}

function toggleEncryptedDemo() {
  if (state.mode !== 'pdf') setMode('pdf');
  state.encryptedDemo = !state.encryptedDemo;
  document.getElementById('btnLockDemo').classList.toggle('active', state.encryptedDemo);
  document.getElementById('lockBar').classList.toggle('hidden', !state.encryptedDemo);
}

function unlockEncryptedDemo() {
  state.encryptedDemo = false;
  document.getElementById('pdfPassInput').value = '';
  document.getElementById('btnLockDemo').classList.remove('active');
  document.getElementById('lockBar').classList.add('hidden');
}

function setMode(mode) {
  if (mode === 'svg') {
    state.mode = 'image';
    state.imgIndex = 2;
  } else if (mode === 'image') {
    state.mode = 'image';
    if (state.imgIndex === 2) state.imgIndex = 0;
  } else {
    state.mode = mode;
  }

  document.querySelectorAll('.demo-btn[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });

  if (state.mode !== 'pdf') {
    state.encryptedDemo = false;
    document.getElementById('btnLockDemo').classList.remove('active');
    document.getElementById('lockBar').classList.add('hidden');
  }
  if (state.mode === 'image' || state.mode === 'empty') {
    state.findOpen = false;
    document.getElementById('findBar').classList.add('hidden');
  }
  render();
}

function toggleSidebar() {
  state.sidebarOpen = !state.sidebarOpen;
  render();
}

function toggleFind() {
  if (state.mode === 'image' || state.mode === 'empty') return;
  state.findOpen = !state.findOpen;
  document.getElementById('findBar').classList.toggle('hidden', !state.findOpen);
  if (state.findOpen) document.getElementById('findInput').focus();
  renderCanvas();
}

function updateFind() {
  state.findQuery = document.getElementById('findInput').value;
  state.findIdx = 0;
  renderCanvas();
}

function stepFind(delta) {
  state.findIdx = (state.findIdx + delta + 4) % 4;
  renderCanvas();
}

function render() {
  renderHeader();
  renderRibbon();
  renderSidebar();
  renderCanvas();
  renderFilmstrip();
  renderStatus();
}

function renderHeader() {
  const fn = document.getElementById('hdrFilename');
  const badge = document.getElementById('hdrBadge');
  badge.className = 'metro-badge';
  if (state.mode === 'pdf') {
    fn.textContent = 'spec_comp_effects.pdf';
    badge.textContent = `PDF · ${state.pdfTotal} PAGES · 2.4 MB`;
  } else if (state.mode === 'markdown') {
    fn.textContent = state.mdHistoryIdx === 0 ? 'spec_kajo_viewer.md' : 'ROADMAP.md';
    badge.textContent = 'MD · 8.4 KB · LIVE WATCH';
    badge.classList.add('live');
  } else if (state.mode === 'image') {
    const img = galleryImages[state.imgIndex];
    fn.textContent = img.name;
    badge.textContent = `${img.decoder} · ${img.res} · ${img.size}`;
  } else {
    fn.textContent = 'No document opened';
    badge.textContent = 'READY · PDF / MD / IMAGE';
  }
}

function renderRibbon() {
  const r = document.getElementById('modeRibbon');
  const sbBtn = `<button class="tool-btn ${state.sidebarOpen ? 'active' : ''}" onclick="toggleSidebar()">☰ SIDEBAR</button>`;
  const findBtn = `<button class="tool-btn ${state.findOpen ? 'active' : ''}" onclick="toggleFind()">🔍 FIND</button>`;

  if (state.mode === 'pdf') {
    r.innerHTML = `
      <div class="ribbon-left">
        ${sbBtn}
        <div class="ribbon-sep"></div>
        <button class="tool-btn" onclick="pdfStep(-1)">◀ PREV</button>
        <input class="page-jump-input" value="${state.pdfPage}" onchange="pdfJump(this.value)" />
        <span style="color:var(--text-secondary);font-size:11px;">/ ${state.pdfTotal}</span>
        <button class="tool-btn" onclick="pdfStep(1)">NEXT ▶</button>
        <div class="ribbon-sep"></div>
        <button class="tool-btn" onclick="zoomPdf(-15)">−</button>
        <span style="min-width:42px;text-align:center;font-weight:700;">${state.pdfZoom}%</span>
        <button class="tool-btn" onclick="zoomPdf(15)">+</button>
        <div class="seg-group">
          <button class="seg-btn ${state.pdfZoom===100?'active':''}" onclick="state.pdfZoom=100;render()">FIT W</button>
          <button class="seg-btn ${state.pdfZoom===85?'active':''}" onclick="state.pdfZoom=85;render()">FIT P</button>
          <button class="seg-btn ${state.pdfZoom===120?'active':''}" onclick="state.pdfZoom=120;render()">100%</button>
        </div>
      </div>
      <div class="ribbon-right">
        <div class="seg-group">
          <button class="seg-btn ${state.pdfSpread==='single'?'active':''}" onclick="state.pdfSpread='single';render()">1P</button>
          <button class="seg-btn ${state.pdfSpread==='spread'?'active':''}" onclick="state.pdfSpread='spread';render()">2P SPREAD</button>
        </div>
        <button class="tool-btn" onclick="state.pdfRot=(state.pdfRot+90)%360;render()">↻ ${state.pdfRot}°</button>
        <div class="seg-group">
          <button class="seg-btn ${state.pdfTone==='paper'?'active':''}" onclick="state.pdfTone='paper';render()">PAPER</button>
          <button class="seg-btn ${state.pdfTone==='sepia'?'active':''}" onclick="state.pdfTone='sepia';render()">SEPIA</button>
          <button class="seg-btn ${state.pdfTone==='dark'?'active':''}" onclick="state.pdfTone='dark';render()">DARK</button>
        </div>
        ${findBtn}
      </div>`;
  } else if (state.mode === 'markdown') {
    r.innerHTML = `
      <div class="ribbon-left">
        ${sbBtn}
        <button class="tool-btn" ${state.mdHistoryIdx===0?'disabled':''} onclick="state.mdHistoryIdx=0;render()">◀</button>
        <button class="tool-btn" ${state.mdHistoryIdx===1?'disabled':''} onclick="state.mdHistoryIdx=1;render()">▶</button>
        <div class="ribbon-sep"></div>
        <div class="seg-group">
          <button class="seg-btn ${state.mdWidth==='narrow'?'active':''}" onclick="state.mdWidth='narrow';render()">NARROW</button>
          <button class="seg-btn ${state.mdWidth==='comfort'?'active':''}" onclick="state.mdWidth='comfort';render()">COMFORT</button>
          <button class="seg-btn ${state.mdWidth==='full'?'active':''}" onclick="state.mdWidth='full';render()">FULL</button>
        </div>
        <button class="tool-btn" onclick="state.mdFontPct=Math.max(80,state.mdFontPct-10);render()">A-</button>
        <span style="min-width:38px;text-align:center;font-weight:700;">${state.mdFontPct}%</span>
        <button class="tool-btn" onclick="state.mdFontPct=Math.min(180,state.mdFontPct+10);render()">A+</button>
      </div>
      <div class="ribbon-right">
        <button class="tool-btn ${state.mdRaw?'active':''}" onclick="state.mdRaw=!state.mdRaw;render()">${state.mdRaw?'RENDERED':'RAW SOURCE'}</button>
        <span class="metro-badge">🔒 READ-ONLY</span>
        <button class="tool-btn">✎ OPEN IN IDE</button>
        ${findBtn}
      </div>`;
  } else if (state.mode === 'image') {
    r.innerHTML = `
      <div class="ribbon-left">
        ${sbBtn}
        <div class="ribbon-sep"></div>
        <button class="tool-btn" onclick="stepImg(-1)">◀ PREV</button>
        <span style="color:var(--text-secondary);font-size:11px;">${state.imgIndex+1} / ${galleryImages.length}</span>
        <button class="tool-btn" onclick="stepImg(1)">NEXT ▶</button>
        <div class="ribbon-sep"></div>
        <button class="tool-btn" onclick="zoomImg(-25)">−</button>
        <span style="min-width:44px;text-align:center;font-weight:700;">${state.imgZoom}%</span>
        <button class="tool-btn" onclick="zoomImg(25)">+</button>
        <div class="seg-group">
          <button class="seg-btn ${state.imgZoom===100?'active':''}" onclick="state.imgZoom=100;state.imgPanX=0;state.imgPanY=0;render()">FIT</button>
          <button class="seg-btn ${state.imgZoom===200?'active':''}" onclick="state.imgZoom=200;render()">1:1</button>
          <button class="seg-btn ${state.imgZoom===300?'active':''}" onclick="state.imgZoom=300;render()">300%</button>
        </div>
      </div>
      <div class="ribbon-right">
        <button class="tool-btn" onclick="state.imgRot=(state.imgRot+90)%360;render()">↻ 90°</button>
        <button class="tool-btn ${state.imgFlipH?'active':''}" onclick="state.imgFlipH=!state.imgFlipH;render()">⇄ FLIP</button>
        <button class="tool-btn ${state.imgChecker?'active':''}" onclick="state.imgChecker=!state.imgChecker;render()">▦ ALPHA</button>
        <button class="tool-btn ${state.imgFilmstrip?'active':''}" onclick="state.imgFilmstrip=!state.imgFilmstrip;render()">🎞 STRIP</button>
        <button class="tool-btn">📋 COPY</button>
      </div>`;
  } else {
    r.innerHTML = `<div class="ribbon-left"><span style="color:var(--text-muted);font-size:11px;">Drop a PDF, Markdown, or Image file into the canvas or click 📂 OPEN</span></div>`;
  }
}

function renderSidebar() {
  const sb = document.getElementById('viewerSidebar');
  const shouldShow = state.sidebarOpen && state.mode !== 'empty';
  sb.classList.toggle('hidden', !shouldShow);
  if (!shouldShow) return;

  if (state.mode === 'pdf') {
    const hdr = `
      <div class="sidebar-header">
        <div class="seg-group" style="width:100%">
          <button class="seg-btn ${state.pdfTab==='outline'?'active':''}" style="flex:1" onclick="state.pdfTab='outline';renderSidebar()">OUTLINE</button>
          <button class="seg-btn ${state.pdfTab==='pages'?'active':''}" style="flex:1" onclick="state.pdfTab='pages';renderSidebar()">PAGES</button>
        </div>
      </div>`;
    let body = '<div class="sidebar-content">';
    if (state.pdfTab === 'outline') {
      body += pdfOutline.map(o => `
        <div class="toc-item lvl-${o.lvl} ${state.pdfPage===o.page?'active':''}" onclick="state.pdfPage=${o.page};render()">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${o.title}</span>
          <span class="toc-page">${o.page}</span>
        </div>`).join('');
    } else {
      for (let p = 1; p <= 6; p++) {
        body += `
          <div class="thumb-card ${state.pdfPage===p?'active':''}" onclick="state.pdfPage=${p};render()">
            <div class="thumb-preview">
              <div style="font-weight:700;border-bottom:1px solid #ccc;margin-bottom:4px;">Page ${p} — Kajo Effects</div>
              Lorem ipsum dolor sit amet, Vulkan linear-light render pass target caching with dual-filter Kawase backdrop blur.
            </div>
            <div class="thumb-label">PAGE ${p}</div>
          </div>`;
      }
    }
    sb.innerHTML = hdr + body + '</div>';
  } else if (state.mode === 'markdown') {
    sb.innerHTML = `
      <div class="sidebar-header"><span class="sidebar-title">HEADING OUTLINE</span><span class="metro-badge">4</span></div>
      <div class="sidebar-content">
        ${mdOutline.map((h, i) => `
          <div class="toc-item lvl-${h.lvl} ${i===0?'active':''}" onclick="document.getElementById('${h.id}')?.scrollIntoView({behavior:'smooth'})">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${h.title}</span>
          </div>`).join('')}
        <div class="meta-section" style="margin-top:14px;">
          <div class="meta-head">WATCHER TELEMETRY</div>
          <div class="meta-row"><span class="meta-k">Live Monitor</span><span class="meta-v" style="color:#4cd964;">ACTIVE</span></div>
          <div class="meta-row"><span class="meta-k">Mermaid Blocks</span><span class="meta-v">1 SVG Vector</span></div>
          <div class="meta-row"><span class="meta-k">Checklists</span><span class="meta-v">${state.mdChecks.filter(Boolean).length} / ${state.mdChecks.length}</span></div>
        </div>
      </div>`;
  } else if (state.mode === 'image') {
    const img = galleryImages[state.imgIndex];
    sb.innerHTML = `
      <div class="sidebar-header"><span class="sidebar-title">IMAGE INSPECTOR</span><span class="metro-badge">${img.kind}</span></div>
      <div class="sidebar-content">
        <div class="meta-section">
          <div class="meta-head">DECODER & DIMENSIONS</div>
          <div class="meta-row"><span class="meta-k">Backend</span><span class="meta-v">${img.decoder}</span></div>
          <div class="meta-row"><span class="meta-k">Resolution</span><span class="meta-v">${img.res}</span></div>
          <div class="meta-row"><span class="meta-k">File Size</span><span class="meta-v">${img.size}</span></div>
          <div class="meta-row"><span class="meta-k">Zoom</span><span class="meta-v">${state.imgZoom}%</span></div>
          <div class="meta-row"><span class="meta-k">Transform</span><span class="meta-v">${state.imgRot}° ${state.imgFlipH?'· FlipH':''}</span></div>
        </div>
        <div class="meta-section">
          <div class="meta-head">EXIF & COLORIMETRY</div>
          <div class="meta-row"><span class="meta-k">Source</span><span class="meta-v">${img.camera}</span></div>
          <div class="meta-row"><span class="meta-k">Profile</span><span class="meta-v">${img.profile}</span></div>
          <div class="meta-row"><span class="meta-k">Details</span><span class="meta-v">${img.exposure}</span></div>
        </div>
      </div>`;
  }
}

function highlightText(htmlText) {
  if (!state.findOpen || !state.findQuery.trim()) return htmlText;
  const q = state.findQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let count = 0;
  return htmlText.replace(new RegExp(q, 'gi'), m => {
    const isAct = (count === state.findIdx);
    count++;
    return `<span class="find-hl ${isAct?'active':''}">${m}</span>`;
  });
}

function renderPdfSheet(pageNum) {
  const toneCls = state.pdfTone === 'paper' ? '' : state.pdfTone;
  const scale = (state.pdfZoom / 100);
  const rawHtml = `
    <div class="pdf-hdr-meta">
      <span>KAJO DESKTOP SUITE · COMPOSITOR EFFECTS SPEC</span>
      <span>PAGE ${pageNum} OF ${state.pdfTotal}</span>
    </div>
    <h1>${pageNum}. Linear-Light Vulkan Render Pipeline</h1>
    <p>All visual effects inside <code>kajo-comp</code> execute directly inside linear light before output transfer encoding via our forked Vulkan renderer in <code>wlroots 0.20.2</code>. By integrating Dual-Filter Kawase frosted glass with pooled offscreen targets, frame damage remains strictly bounded.</p>
    <h2>${pageNum}.1 Vulkan Offscreen Target Chain (X3)</h2>
    <p>Backdrop regions beneath transparent Aero + Metro surfaces (<code>kajo</code>, <code>kajo-viewer</code>, <code>kitty</code>) are cached when occluded nodes remain undamaged. When no damage occurs, Vulkan submits zero redundant blur passes.</p>
    <div class="pdf-callout"><strong>Verification Note:</strong> Headless Vulkan pixel verification reads back bit-exact 8-bit SDR patches across #101010, #0078d4, and #ffffff surfaces.</div>
    <div class="pdf-diagram-box">
      [Scene Nodes] ──▶ [Below-Node Pass] ──▶ [Vulkan Blur Down/Up] ──▶ [Surface Blend] ──▶ [BT.2390 Output]
    </div>
    <p>Text selection uses <code>poppler_page_get_selected_text()</code> with native Wayland clipboard integration, while encrypted PDFs scrub transient password buffers immediately via <code>explicit_bzero()</code>.</p>`;

  return `
    <div class="pdf-sheet ${toneCls} ${pageNum===state.pdfPage?'selected-page':''}"
         style="transform: scale(${scale}) rotate(${state.pdfRot}deg);"
         onclick="state.pdfPage=${pageNum};renderSidebar();renderStatus();">
      ${highlightText(rawHtml)}
    </div>`;
}

function renderCanvas() {
  const area = document.getElementById('canvasArea');

  if (state.mode === 'image') {

      : `<svg viewBox="0 0 640 380" width="560" height="332" style="display:block;">

             <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">

               <stop offset="100%" stop-color="#ff8c00" stop-opacity="0.75"/>
             </linearGradient>

           <rect width="640" height="380" fill="url(#sky)"/>

           <polygon points="210,380 430,165 640,380" fill="#181d28"/>
           <circle cx="490" cy="105" r="42" fill="#ffb900"/>
           <rect x="20" y="20" width="230" height="28" fill="rgba(16,16,16,0.78)" stroke="#0078d4"/>
           <text x="30" y="38" fill="#ffffff" font-family="Fira Code, monospace" font-size="11">${img.name}</text>
         </svg>`;

    area.innerHTML = `
      <div class="image-stage">
        <div class="image-viewport" onmousedown="startPan(event)">
          <div class="image-frame ${state.imgChecker?'checkerboard':''}"

               style="transform: translate(${state.imgPanX}px, ${state.imgPanY}px) scale(${scale * flip}, ${scale}) rotate(${state.imgRot}deg);">

  area.innerHTML = `

        <span class="metro-badge" style="cursor:pointer" onclick="setMode('pdf')">PDF (Poppler)</span>

function renderFilmstrip() {
  const fs = document.getElementById('imageFilmstrip');
  const show = state.mode === 'image' && state.imgFilmstrip;
  fs.classList.toggle('hidden', !show);
  if (!show) return;
  fs.innerHTML = galleryImages.map((img, i) => `
    <div class="film-thumb ${i===state.imgIndex?'active':''}" onclick="state.imgIndex=${i};render()">
      <span style="color:var(--metro-telemetry);font-weight:700;">${img.kind}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${img.name}</span>
    </div>`).join('');
}

function renderStatus() {
  const s = document.getElementById('statusStrip');
  if (state.mode === 'pdf') {
    s.innerHTML = `
      <div class="status-left">
        <span class="status-accent">PAGE ${state.pdfPage} / ${state.pdfTotal}</span>
        <span>ZOOM ${state.pdfZoom}%</span>
        <span>${state.pdfSpread === 'spread' ? '2P SPREAD' : '1P CONTINUOUS'}</span>
        <span>TONE: ${state.pdfTone.toUpperCase()}</span>
      </div>
      <div class="status-right"><span>~/src/Kajo/docs/spec_comp_effects.pdf</span></div>`;
  } else if (state.mode === 'markdown') {
    s.innerHTML = `
      <div class="status-left">
        <span class="status-accent">MARKDOWN + MERMAID</span>
        <span>WIDTH: ${state.mdWidth.toUpperCase()}</span>
        <span>FONT: ${state.mdFontPct}%</span>
        <span>READ-ONLY</span>
      </div>
      <div class="status-right"><span>~/src/Kajo/ROADMAP.md</span></div>`;
  } else if (state.mode === 'image') {
    const img = galleryImages[state.imgIndex];
    s.innerHTML = `
      <div class="status-left">
        <span class="status-accent">${img.res}</span>
        <span>ZOOM ${state.imgZoom}%</span>
        <span>ROT ${state.imgRot}°</span>
        <span>FILE ${state.imgIndex + 1} / ${galleryImages.length}</span>
      </div>
      <div class="status-right"><span>~/Pictures/${img.name}</span></div>`;
  } else {
    s.innerHTML = `<div class="status-left"><span class="status-accent">IDLE · 0.0% CPU</span></div><div class="status-right"><span>org.kajo.Viewer</span></div>`;
  }
}

function pdfStep(d) { state.pdfPage = Math.max(1, Math.min(state.pdfTotal, state.pdfPage + d)); render(); }
function pdfJump(v) { const n = parseInt(v, 10); if (!isNaN(n)) state.pdfPage = Math.max(1, Math.min(state.pdfTotal, n)); render(); }
function zoomPdf(d) { state.pdfZoom = Math.max(50, Math.min(200, state.pdfZoom + d)); render(); }
function stepImg(d) { state.imgIndex = (state.imgIndex + d + galleryImages.length) % galleryImages.length; state.imgPanX = 0; state.imgPanY = 0; render(); }
function zoomImg(d) { state.imgZoom = Math.max(25, Math.min(800, state.imgZoom + d)); render(); }

let panDrag = null;
function startPan(e) {
  panDrag = { x: e.clientX - state.imgPanX, y: e.clientY - state.imgPanY };
  const onMove = ev => {
    if (!panDrag) return;
    state.imgPanX = ev.clientX - panDrag.x;
    state.imgPanY = ev.clientY - panDrag.y;
    const f = document.getElementById('imgFrame');
    if (f) f.style.transform = `translate(${state.imgPanX}px, ${state.imgPanY}px) scale(${(state.imgZoom/100)*(state.imgFlipH?-1:1)}, ${state.imgZoom/100}) rotate(${state.imgRot}deg)`;
  };
  const onUp = () => { panDrag = null; window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFind(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleSidebar(); }
  else if (state.mode === 'image' && e.key === 'ArrowRight') stepImg(1);
  else if (state.mode === 'image' && e.key === 'ArrowLeft') stepImg(-1);
});

render();
</script>
