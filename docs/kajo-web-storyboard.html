<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KAJO WEB — Interactive Architecture &amp; UX Storyboard</title>
<style>
  :root {
    --bg: #070707;
    --surface-0: #0c0c0c;
    --surface-1: #101010;
    --surface-2: #141414;
    --surface-3: #181818;
    --surface-4: #1e1e1e;
    --border: #2b2b2b;
    --border-strong: #3c3c3c;
    --text: #ffffff;
    --subtext: #a4a4a4;
    --dim: #767676;
    --accent: #0078d4;
    --accent-rgb: 0, 120, 212;
    --telemetry: #00d8f0;
    --success: #10893e;
    --warning: #ff8c00;
    --urgent: #e81123;
    --magenta: #b4009e;
    --font-mono: 'Fira Code', 'JetBrains Mono', ui-monospace, monospace;
    --font-sans: 'Inter', 'Cantarell', 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; border-radius: 0 !important; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100vh; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans); font-size: 13px;
    user-select: none;
  }
  button { font-family: var(--font-mono); }

  /* ── Top Bar (40px) ── */
  .topbar {
    height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: var(--surface-2); border-bottom: 1px solid var(--border);
    white-space: nowrap; overflow: hidden;
  }
  .title {
    font-family: var(--font-mono); font-weight: 800; letter-spacing: .7px; font-size: 12px;
    display: flex; align-items: center; gap: 7px;
  }
  .title .ico { color: var(--accent); font-size: 14px; }
  .title small { color: var(--dim); font-weight: 400; font-size: 10px; }
  .seg { display: flex; border: 1px solid var(--border); }
  .seg button {
    background: var(--surface-3); color: #bbb; border: 0;
    border-right: 1px solid var(--border); padding: 3px 8px;
    font-size: 10px; font-weight: 700; cursor: pointer;
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: #222; color: #fff; }
  .seg button.on { background: var(--accent); color: #fff; }
  .spacer { flex: 1; }
  .btn {
    background: var(--surface-3); color: #ddd; border: 1px solid var(--border);
    padding: 4px 9px; font-size: 10px; font-weight: 700; cursor: pointer; letter-spacing: .4px;
  }
  .btn:hover { background: #222; color: #fff; border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.playing { background: var(--urgent); border-color: var(--urgent); color: #fff; }
  .btn:disabled { opacity: .35; pointer-events: none; }
  .step-pill {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .6px;
    padding: 4px 10px; border: 1px solid var(--accent);
    background: rgba(var(--accent-rgb), .18); color: var(--telemetry);
    min-width: 96px; text-align: center;
  }

  /* ── Main 2-Column Layout ── */
  main { display: flex; height: calc(100vh - 40px - 28px); }
  .stage-col { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 10px; gap: 10px; }

  .scenario-strip {
    display: flex; gap: 5px; flex-wrap: nowrap; overflow-x: auto; flex-shrink: 0;
  }
  .scenario-strip::-webkit-scrollbar { height: 3px; background: #0c0c0c; }
  .scenario-strip::-webkit-scrollbar-thumb { background: #333; }
  .sc-btn {
    flex: 1;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--subtext); padding: 5px 8px; font-size: 10px; font-weight: 700;
    cursor: pointer; white-space: nowrap; text-align: center;
  }
  .sc-btn:hover { background: var(--surface-3); color: #fff; }
  .sc-btn.on {
    background: rgba(var(--accent-rgb), 0.22);
    border-color: var(--accent);
    color: #fff;
  }

  .screen-wrap {
    flex: 1; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.010) 0 1px, transparent 1px 40px),
      #050505;
    border: 1px solid var(--border); overflow: hidden;
  }

  .bezel {
    position: relative;
    border: 1px solid var(--accent);
    box-shadow: 0 14px 48px rgba(0, 0, 0, 0.88);
    overflow: hidden;
    background: var(--surface-0);
  }

  /* Scaled Compositor Desktop Inside Bezel (1200x720 logical) */
  .sim-screen {
    width: 1200px; height: 720px;
    position: absolute; left: 0; top: 0; transform-origin: 0 0;
    display: flex; flex-direction: column;
    background: #0a0a0a;
    overflow: hidden;
  }

  /* Simulated Kajo Top Panel (28px) */
  .sim-panel {
    height: 28px; flex-shrink: 0;
    background: rgba(18, 18, 18, 0.90);
    border-bottom: 1px solid #242424;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; font-family: var(--font-mono); font-size: 10px; color: #bbb;
  }
  .sim-panel .ws-pills { display: flex; gap: 4px; }
  .sim-panel .ws { padding: 1px 6px; border: 1px solid #2b2b2b; background: #141414; }
  .sim-panel .ws.on { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.25); color: #fff; }

  /* Tiled Compositor Workspace */
  .sim-ws {
    flex: 1; min-height: 0; padding: 6px; display: flex; gap: 6px; position: relative;
  }

  /* Simulated kajo-web Window */
  .sb-browser {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: #141414; border: 1px solid var(--accent); position: relative; overflow: hidden;
  }
  .sb-hdr {
    height: 32px; background: #181818; border-bottom: 1px solid #2b2b2b;
    display: flex; align-items: center; padding: 0 8px; gap: 6px;
    font-family: var(--font-mono); font-size: 10.5px;
    transition: transform 220ms ease;
  }
  .sb-omni {
    flex: 1; max-width: 520px; margin: 0 auto; height: 22px;
    background: #0e0e0e; border: 1px solid #2b2b2b;
    display: flex; align-items: center; padding: 0 8px; gap: 6px;
    font-size: 10.5px;
  }
  .sb-omni.focus { border-color: var(--accent); background: #080808; }
  .sb-badge {
    padding: 1px 6px; font-size: 9.5px; font-weight: 700;
    border: 1px solid #2b2b2b; background: #141414; color: #ccc;
  }
  .sb-badge.shield { border-color: rgba(var(--accent-rgb), .5); color: var(--telemetry); background: rgba(var(--accent-rgb), .14); }
  .sb-badge.warn { border-color: var(--warning); color: #ffb84d; background: rgba(255, 140, 0, .18); }

  .sb-body {
    flex: 1; min-height: 0; display: flex; position: relative; overflow: hidden; background: #101010;
  }
  .sb-browser.rail-right .sb-body { flex-direction: row-reverse; }

  /* Trigger Strip */
  .sb-trigger {
    position: absolute; top: 0; bottom: 0; left: 0; width: 6px; z-index: 20;
    border-left: 2px solid transparent;
  }
  .sb-browser.rail-right .sb-trigger { left: auto; right: 0; }
  .sb-trigger.lit { background: rgba(var(--accent-rgb), 0.35); border-left-color: var(--accent); }
  .sb-ticks {
    position: absolute; top: 14px; left: 0; width: 2px; display: flex; flex-direction: column; gap: 5px;
  }
  .sb-browser.rail-right .sb-ticks { left: auto; right: 0; }
  .sb-tick { width: 2px; height: 14px; background: #383838; }
  .sb-tick.on { height: 22px; background: var(--accent); }

  /* Vertical Rail in Storyboard */
  .sb-rail {
    position: absolute; top: 0; bottom: 0; left: 0; width: 225px;
    background: rgba(18, 18, 18, 0.96); border-right: 1px solid #2b2b2b;
    display: flex; flex-direction: column; z-index: 25;
    transform: translateX(-100%);
    transition: transform 260ms cubic-bezier(0.2, 0.9, 0.2, 1), width 220ms ease;
    box-shadow: 12px 0 32px rgba(0,0,0,0.8);
  }
  .sb-browser.rail-right .sb-rail {
    left: auto; right: 0; border-right: 0; border-left: 1px solid #2b2b2b;
    transform: translateX(100%);
    box-shadow: -12px 0 32px rgba(0,0,0,0.8);
  }
  .sb-browser.rail-open .sb-rail { transform: translateX(0); }
  .sb-browser.rail-compact .sb-rail {
    position: relative; transform: none; width: 42px; box-shadow: none;
  }
  .sb-browser.rail-pinned .sb-rail {
    position: relative; transform: none; width: 225px; box-shadow: none;
  }

  .sb-pin-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    padding: 6px; border-bottom: 1px solid #2b2b2b;
  }
  .sb-browser.rail-compact .sb-pin-grid { grid-template-columns: 1fr; padding: 4px; }
  .sb-pin {
    height: 28px; background: #181818; border: 1px solid #2b2b2b;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .sb-pin.on { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.24); }
  .sb-tab {
    height: 32px; padding: 0 8px; display: flex; align-items: center; gap: 7px;
    border-left: 3px solid transparent; font-size: 11px; color: #ccc;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .sb-tab.on { background: rgba(var(--accent-rgb), 0.24); border-left-color: #fff; color: #fff; font-weight: 600; }
  .sb-tab.susp { opacity: 0.5; }
  .sb-browser.rail-compact .sb-tab-txt { display: none; }
  .sb-browser.rail-compact .sb-tab { justify-content: center; padding: 0; }
  .sb-grp {
    padding: 4px 9px; font-family: var(--font-mono); font-size: 9.5px; font-weight: 700;
    color: var(--dim); border-left: 3px solid var(--accent); margin-top: 4px;
  }
  .sb-browser.rail-compact .sb-grp { display: none; }

  /* Viewport Content */
  .sb-viewport {
    flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative;
  }
  .sb-perm {
    background: #1a1a1a; border-bottom: 1px solid var(--warning);
    padding: 6px 12px; font-family: var(--font-mono); font-size: 10.5px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sb-page {
    flex: 1; padding: 24px 32px; overflow: hidden; position: relative;
  }
  .sb-page h2 { font-family: var(--font-mono); font-size: 18px; margin-bottom: 8px; }
  .sb-page p { color: #bbb; font-size: 12.5px; line-height: 1.6; max-width: 680px; margin-bottom: 12px; }
  .sb-card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; max-width: 720px; }
  .sb-card {
    background: #181818; border: 1px solid #2b2b2b; border-top: 2px solid var(--accent);
    padding: 12px; font-family: var(--font-mono);
  }
  .sb-card .k { font-size: 9.5px; color: var(--dim); }
  .sb-card .v { font-size: 12px; font-weight: 700; color: var(--telemetry); margin-top: 4px; }

  /* Overlay Modals Inside Browser */
  .sb-palette {
    position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
    width: 480px; background: #181818; border: 1px solid var(--accent);
    box-shadow: 0 18px 48px rgba(0,0,0,0.9); z-index: 40; font-family: var(--font-mono);
  }
  .sb-pal-in { padding: 9px 12px; background: #0e0e0e; border-bottom: 1px solid #2b2b2b; color: #fff; font-size: 12px; }
  .sb-pal-row { padding: 7px 12px; border-bottom: 1px solid #222; font-size: 11px; display: flex; gap: 8px; }
  .sb-pal-row.on { background: rgba(var(--accent-rgb), 0.25); }

  /* Floating Native FileChooser Portal Window */
  .sb-portal {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 560px; height: 340px; background: #141414; border: 1px solid var(--accent);
    box-shadow: 0 24px 64px rgba(0,0,0,0.92); z-index: 50;
    display: flex; flex-direction: column; font-family: var(--font-mono);
  }
  .sb-portal-hdr {
    height: 30px; background: #181818; border-bottom: 1px solid #2b2b2b;
    padding: 0 10px; display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; font-weight: 700;
  }
  .sb-portal-body { flex: 1; display: flex; }
  .sb-portal-side { width: 140px; background: #111; border-right: 1px solid #2b2b2b; padding: 8px; font-size: 10.5px; color: #aaa; display: flex; flex-direction: column; gap: 6px; }
  .sb-portal-main { flex: 1; padding: 10px; font-size: 11px; display: flex; flex-direction: column; gap: 6px; }
  .sb-portal-row { padding: 6px 8px; background: #181818; border: 1px solid #262626; display: flex; justify-content: space-between; }
  .sb-portal-row.on { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.24); }

  /* Side-by-Side Tiled kajo-settings Column */
  .sb-settings-col {
    width: 390px; flex-shrink: 0; background: #141414; border: 1px solid #2b2b2b;
    display: flex; flex-direction: column; font-family: var(--font-mono);
  }
  .sb-settings-col.focused { border-color: var(--accent); }
  .sb-set-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 11px; }
  .sb-set-card { background: #181818; border: 1px solid #2b2b2b; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .sb-set-row { display: flex; justify-content: space-between; align-items: center; }

  /* Docked Inspector */
  .sb-insp {
    height: 150px; background: #0e0e0e; border-top: 1px solid var(--accent);
    padding: 8px 12px; font-family: var(--font-mono); font-size: 10.5px; color: #9cd4ff; line-height: 1.5;
  }

  /* Animated Cursor & Keystroke HUD */
  .sim-cursor {
    position: absolute; width: 14px; height: 14px;
    border-left: 2px solid #fff; border-top: 2px solid #fff;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.9);
    z-index: 70; pointer-events: none;
    transition: left 380ms cubic-bezier(0.2, 0.9, 0.2, 1), top 380ms cubic-bezier(0.2, 0.9, 0.2, 1), opacity 200ms ease;
  }
  .key-hud {
    position: absolute; right: 16px; bottom: 16px;
    background: rgba(14, 14, 14, 0.94); border: 1px solid var(--accent);
    padding: 6px 12px; font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    color: var(--telemetry); z-index: 65; letter-spacing: 0.6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.85);
  }
  .callout-box {
    position: absolute; z-index: 60;
    background: rgba(16, 16, 16, 0.95);
    border: 1px solid var(--telemetry);
    border-left: 4px solid var(--telemetry);
    padding: 7px 10px; max-width: 310px;
    font-family: var(--font-mono); font-size: 10.5px; color: #e8fbff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.85);
  }

  /* ── Right Narration & State Sidebar (330px) ── */
  .sidebar {
    width: 330px; flex-shrink: 0; background: var(--surface-2);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .side-sec {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  .side-k {
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 700;
    color: var(--telemetry); letter-spacing: 0.7px; margin-bottom: 6px;
  }
  .side-title { font-family: var(--font-mono); font-size: 13px; font-weight: 800; margin-bottom: 6px; }
  .side-desc { color: #cccccc; font-size: 12px; line-height: 1.55; }

  .step-dots { display: flex; gap: 5px; margin-top: 10px; }
  .sdot {
    flex: 1; height: 4px; background: #2b2b2b; cursor: pointer;
  }
  .sdot.done { background: rgba(var(--accent-rgb), 0.55); }
  .sdot.on { background: var(--accent); }

  .state-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-family: var(--font-mono);
  }
  .st-kv {
    background: var(--surface-1); border: 1px solid #242424; padding: 6px 8px;
  }
  .st-kv .k { font-size: 9px; color: var(--dim); }
  .st-kv .v { font-size: 10.5px; font-weight: 700; color: #fff; margin-top: 2px; }
  .st-kv .v.accent { color: var(--telemetry); }
  .st-kv .v.warn { color: #ffb84d; }
  .st-kv .v.ok { color: #4ce886; }

  .spec-ref {
    flex: 1; overflow-y: auto; padding: 12px 14px; font-family: var(--font-mono); font-size: 10.5px; color: var(--subtext); line-height: 1.55;
  }

  /* ── Bottom Status Footer (28px) ── */
  footer {
    height: 28px; background: var(--surface-1); border-top: 1px solid var(--border);
    padding: 0 12px; display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-mono); font-size: 10px; color: var(--dim);
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="title">
      <span class="ico">🌐</span>
      <span>KAJO WEB // STORYBOARD</span>
      <small>7 SCENARIOS • SPEC docs/spec_kajo_web.md</small>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnPrev">◀ PREV</button>
    <button class="btn primary" id="btnPlay">▶ PLAY</button>
    <button class="btn" id="btnNext">NEXT ▶</button>
    <button class="btn" id="btnReset">↺ RESET</button>
    <div class="step-pill" id="stepPill">STEP 01 / 04</div>
  </div>

  <main>
    <section class="stage-col">
      <div class="scenario-strip" id="scenarioStrip"></div>
      <div class="screen-wrap" id="screenWrap">
        <div class="bezel" id="bezel">
          <div class="sim-screen" id="simScreen"></div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="side-sec">
        <div class="side-k" id="sideScLabel">SCENARIO 01</div>
        <div class="side-title" id="sideStepTitle">Title</div>
        <div class="side-desc" id="sideStepDesc">Description</div>
        <div class="step-dots" id="stepDots"></div>
      </div>
      <div class="side-sec">
        <div class="side-k">LIVE STATE INSPECTOR</div>
        <div class="state-grid" id="stateGrid"></div>
      </div>
      <div class="spec-ref" id="specRef"></div>
    </aside>
  </main>

  <footer>
    <span>KEYBOARD: ← / → STEP • SPACE PLAY/PAUSE • 1–7 SCENARIOS</span>
    <span>KAJO AERO + METRO • CHROMIUM/CEF ALLOY (WAYLAND + VA-API)</span>
  </footer>

<script>
const SCENARIOS = [
  {
    id: 'S1',
    name: 'S1: Autohide Rail',
    steps: [
      {
        title: '1. Full-Viewport Resting State',
        desc: 'In default autohide mode, kajo-web hides the vertical tab rail into a 4px left edge trigger strip (rgba(0,0,0,0.01)) with 2px accent ticks showing open tabs. The web page gets 100% of the tiled column.',
        key: '',
        cursor: { x: 640, y: 360 },
        callout: { x: 26, y: 290, text: '4px trigger strip + 2px tab ticks: zero wasted horizontal width' },
        st: { rail_mode: 'autohide', rail_state: 'COLLAPSED', reflow: '0 px', gpu: 'CEF+VAAPI' },
        spec: '§3.2 & §3.3 — Autohide Rail FSM starts in COLLAPSED. Zero-reflow overlay rendered via kajo-chrome://ui/rail.html.',
        view: { railMode: 'autohide', railOpen: false, triggerLit: false, tab: 'github' }
      },
      {
        title: '2. Pointer Hits Left Edge Trigger (35ms Debounce)',
        desc: 'Moving the pointer to x < 4px enters REVEAL_WAIT and starts a real 35ms debounce timer (configurable in web.toml). Accidental edge brushes that leave early cancel cleanly without flicker.',
        key: 'POINTER → EDGE (35ms)',
        cursor: { x: 10, y: 240 },
        callout: { x: 28, y: 210, text: 'REVEAL_WAIT timer (35ms): cancels if pointer leaves early' },
        st: { rail_mode: 'autohide', rail_state: 'REVEAL_WAIT', reflow: '0 px', gpu: 'CEF+VAAPI' },
        spec: '§3.3 — Real timer transitions driven by web_model rail FSM (rail_reveal_delay_ms, 0..300ms).',
        view: { railMode: 'autohide', railOpen: false, triggerLit: true, tab: 'github' }
      },
      {
        title: '3. 240px Overlay Rail Slides Over Content',
        desc: 'The 240px Aero + Metro vertical tab rail slides out directly over the CefBrowserView viewport. Notice the GitHub text behind it does NOT wrap or reflow—zero layout thrash!',
        key: 'RAIL → EXPANDED',
        cursor: { x: 120, y: 215 },
        callout: { x: 255, y: 170, text: 'Overlay slide-over: CefBrowserView width stays constant (zero DOM reflow)' },
        st: { rail_mode: 'autohide', rail_state: 'EXPANDED', reflow: '0 px (overlay)', gpu: 'CEF+VAAPI' },
        spec: '§3.1 — Pinned square favicon tiles sit at top, collapsible color-coded groups below, active row marked with a crisp 3px accent bar.',
        view: { railMode: 'autohide', railOpen: true, triggerLit: true, tab: 'github' }
      },
      {
        title: '4. Click Tab → Pointer Leaves → Clean Auto-Retract',
        desc: 'Clicking ArchWiki switches the active tab and moving the pointer back into the page starts the 220ms hide grace timer before smoothly sliding the rail away.',
        key: 'CLICK TAB → 220ms HIDE',
        cursor: { x: 520, y: 310 },
        callout: { x: 28, y: 140, text: 'Switched to ArchWiki; rail retracted after 220ms grace period' },
        st: { rail_mode: 'autohide', rail_state: 'COLLAPSED', reflow: '0 px', gpu: 'CEF+VAAPI' },
        spec: '§3.3 — Hold-open pauses hiding whenever a tab drag, context menu, or rename entry is active; Escape dismisses immediately.',
        view: { railMode: 'autohide', railOpen: false, triggerLit: false, tab: 'arch' }
      }
    ]
  },
  {

let scIdx = 0;

const stripEl = document.getElementById('scenarioStrip');
const simEl = document.getElementById('simScreen');
const bezelEl = document.getElementById('bezel');
const wrapEl = document.getElementById('screenWrap');

function fitBezel() {
  const r = wrapEl.getBoundingClientRect();
  const pad = 20;
  const scale = Math.min((r.width - pad) / 1200, (r.height - pad) / 720, 1);
  bezelEl.style.width = Math.round(1200 * scale) + 'px';
  bezelEl.style.height = Math.round(720 * scale) + 'px';
  simEl.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitBezel);

function renderStrip() {
  stripEl.innerHTML = '';
  SCENARIOS.forEach((sc, i) => {
    const b = document.createElement('button');
    b.className = 'sc-btn' + (i === scIdx ? ' on' : '');
    b.textContent = sc.name;
    b.onclick = () => { stopPlay(); scIdx = i; stepIdx = 0; render(); };
    stripEl.appendChild(b);
  });
}

function render() {
  renderStrip();
  const sc = SCENARIOS[scIdx];
  const st = sc.steps[stepIdx];

  document.getElementById('stepPill').textContent = `STEP 0${stepIdx + 1} / 0${sc.steps.length}`;
  document.getElementById('sideScLabel').textContent = sc.name.toUpperCase();
  document.getElementById('sideStepTitle').textContent = st.title;
  document.getElementById('sideStepDesc').textContent = st.desc;
  document.getElementById('specRef').innerHTML = `<div class="side-k">SPECIFICATION INVARIANT</div>${st.spec}`;

  // Step dots
  const dots = document.getElementById('stepDots');
  dots.innerHTML = '';
  sc.steps.forEach((_, idx) => {
    const d = document.createElement('div');
    d.className = 'sdot' + (idx < stepIdx ? ' done' : '') + (idx === stepIdx ? ' on' : '');
    d.onclick = () => { stopPlay(); stepIdx = idx; render(); };
    dots.appendChild(d);
  });

  // State Grid
  const sg = document.getElementById('stateGrid');
  sg.innerHTML = '';
  Object.entries(st.st).forEach(([k, val]) => {
    const cls = /WARN|SW|NEVER/.test(val) ? 'warn' : (/OK|ACTIVE|ON|RESTORED|VERIFIED/.test(val) ? 'ok' : 'accent');
    const div = document.createElement('div');
    div.className = 'st-kv';
    div.innerHTML = `<div class="k">${k.toUpperCase()}</div><div class="v ${cls}">${val}</div>`;
    sg.appendChild(div);
  });

  // Viewport + cursor + callout + key HUD
  let html = renderViewport(st.view);
  if (st.callout) {
    html += `<div class="callout-box" style="left:${st.callout.x}px; top:${st.callout.y}px;">${st.callout.text}</div>`;
  }
  if (st.key) {
    html += `<div class="key-hud">${st.key}</div>`;
  }
  if (st.cursor) {
    html += `<div class="sim-cursor" style="left:${st.cursor.x}px; top:${st.cursor.y}px;"></div>`;
  }
  simEl.innerHTML = html;

  document.getElementById('btnPrev').disabled = (stepIdx === 0 && scIdx === 0);
  document.getElementById('btnNext').disabled = (stepIdx === sc.steps.length - 1 && scIdx === SCENARIOS.length - 1);
  fitBezel();
}

function nextStep() {
  const sc = SCENARIOS[scIdx];
  if (stepIdx < sc.steps.length - 1) stepIdx++;
  else if (scIdx < SCENARIOS.length - 1) { scIdx++; stepIdx = 0; }
  else { stopPlay(); return; }
  render();
}
function prevStep() {
  if (stepIdx > 0) stepIdx--;
  else if (scIdx > 0) { scIdx--; stepIdx = SCENARIOS[scIdx].steps.length - 1; }
  render();
}
function stopPlay() {
  clearInterval(playTimer);
  playTimer = null;
  const b = document.getElementById('btnPlay');
  b.textContent = '▶ PLAY';
  b.classList.remove('playing');
  b.classList.add('primary');
}
function togglePlay() {
  if (playTimer) { stopPlay(); return; }
  const b = document.getElementById('btnPlay');
  b.textContent = '⏸ PAUSE';
  b.classList.remove('primary');
  b.classList.add('playing');
  playTimer = setInterval(nextStep, 2600);
}

document.getElementById('btnPrev').onclick = () => { stopPlay(); prevStep(); };
document.getElementById('btnNext').onclick = () => { stopPlay(); nextStep(); };
document.getElementById('btnPlay').onclick = togglePlay;
document.getElementById('btnReset').onclick = () => { stopPlay(); stepIdx = 0; render(); };

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { stopPlay(); nextStep(); }
  else if (e.key === 'ArrowLeft') { stopPlay(); prevStep(); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key >= '1' && e.key <= '7') { stopPlay(); scIdx = parseInt(e.key, 10) - 1; stepIdx = 0; render(); }
});

render();
</script>
